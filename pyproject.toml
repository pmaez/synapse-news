[project]
name = "synapse-news"
version = "0.1.0"
description = "RSS news monitor and summarizer with local or hosted LLM support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "textual>=0.52.0",
]

[project.scripts]
synapse-news = "synapse_news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_news"]
